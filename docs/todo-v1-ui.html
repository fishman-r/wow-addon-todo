  height: 100%;

}

.form-check-input[type=&quot;radio&quot;]:checked {

.form-check:not(.form-switch) .form-check-input:focus-visible {

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;

}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {

}

.form-check-label {

.form-switch .form-check-input {

  height: 20px;

.form-switch .form-check-input::before {

  top: 50%;
  left: 0;

  height: 16px;

  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));

  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);

.form-switch .form-check-input:focus-visible {

.form-range:focus-visible::-webkit-slider-thumb {

}

.form-range::-moz-range-track {
  height: 28px;

}

.form-range::-moz-range-thumb {

  height: 20px;

    (() =&gt; {
      const root = document.getElementById(&#x27;todo-v1-design&#x27;);
      if (!root) return;

      const tabs = [...root.querySelectorAll(&#x27;[data-tab]&#x27;)];
      const pages = [...root.querySelectorAll(&#x27;[data-page]&#x27;)];
      const overlay = root.querySelector(&#x27;[data-setup-overlay]&#x27;);
      const hoursInput = root.querySelector(&#x27;#todo-hours&#x27;);
      const budgetPreview = root.querySelector(&#x27;.todo-budget-preview&#x27;);
      const estimatedDuration = root.querySelector(&#x27;[data-estimated-duration]&#x27;);
      const startRegionInput = root.querySelector(&#x27;#todo-start-region&#x27;);
      const raidPicker = root.querySelector(&#x27;[data-raid-picker]&#x27;);
      const planSteps = [...root.querySelectorAll(&#x27;[data-plan-step]&#x27;)];
      const planRaid = root.querySelector(&#x27;[data-plan-raid]&#x27;);

      const formatMinutes = (totalMinutes) =&gt; {
        const wholeHours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        if (!wholeHours) return `${minutes} 分`;
        if (!minutes) return `${wholeHours} 小时`;
        return `${wholeHours} 小时 ${minutes} 分`;
      };

      const formatClock = (totalMinutes) =&gt; {
        const wholeHours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        return `${wholeHours}:${String(minutes).padStart(2, &#x27;0&#x27;)}`;
      };

      const getPlanPreview = () =&gt; {
        const hours = Math.max(0, Number(hoursInput.value) || 0);
        const budgetMinutes = Math.round(hours * 60 * 0.85);
        const selectedMode = root.querySelector(&#x27;[data-mode][aria-pressed=&quot;true&quot;]&#x27;);
        const holidaySelected = selectedMode &amp;&amp; selectedMode.dataset.mode === &#x27;holiday&#x27;;
        const selectedRaid = root.querySelector(&#x27;input[name=&quot;todo-raid&quot;]:checked&#x27;);
        const selectedRaidMinutes = selectedRaid ? Number(selectedRaid.dataset.durationMinutes || 0) : 0;
        const raidFitsMode = holidaySelected &amp;&amp; (hours &gt;= 3 || selectedRaidMinutes &lt;= 30);
        const raid = raidFitsMode &amp;&amp; selectedRaid ? selectedRaid : null;
        const raidMinutes = raid ? selectedRaidMinutes : 0;
        const selectedRegion = startRegionInput.options[startRegionInput.selectedIndex];
        const firstMoveMinutes = Number(selectedRegion.dataset.firstMoveMinutes || 0);
        const availableRouteMinutes = Math.max(0, budgetMinutes - raidMinutes);
        let routeMinutes = 0;
        let routeValue = 0;
        let taskCount = 0;
        let blocked = false;

        const steps = planSteps.map((step, index) =&gt; {
          const minutes = index === 0 ? firstMoveMinutes : Number(step.dataset.stepMinutes || 0);
          if (index === 0 &amp;&amp; minutes === 0) return { included: false, minutes };
          if (blocked || routeMinutes + minutes &gt; availableRouteMinutes) {
            blocked = true;
            return { included: false, minutes };
          }
          routeMinutes += minutes;
          if (step.dataset.stepKind === &#x27;task&#x27;) {
            taskCount += 1;
            routeValue += Number(step.dataset.stepValue || 0);
          }
          return { included: true, minutes };
        });

        return {
          hours,
          budgetMinutes,
          mode: holidaySelected ? &#x27;holiday&#x27; : &#x27;workday&#x27;,
          modeLabel: holidaySelected ? &#x27;假期&#x27; : &#x27;工作日&#x27;,
          regionLabel: selectedRegion.textContent.replace(&#x27; / 不计算首段路程&#x27;, &#x27;&#x27;),
          firstMoveMinutes,
          raid,
          raidMinutes,
          routeMinutes,
          routeValue,
          taskCount,
          totalMinutes: raidMinutes + routeMinutes,
          steps,
        };
      };

      const updateEstimatedDuration = () =&gt; {
        estimatedDuration.textContent = formatMinutes(getPlanPreview().totalMinutes);
      };

      const applyPlanPreview = (plan) =&gt; {
        root.querySelector(&#x27;[data-plan-title]&#x27;).textContent = `${plan.modeLabel}计划 · 从${plan.regionLabel}出发`;
        root.querySelector(&#x27;[data-plan-meta]&#x27;).textContent = `预设本次可玩 ${formatMinutes(Math.round(plan.hours * 60))} · 自动规划预算 ${formatMinutes(plan.budgetMinutes)} · 计划刚刚生成`;
        root.querySelector(&#x27;[data-session-time]&#x27;).textContent = `0:00 / ${formatClock(Math.round(plan.hours * 60))}`;
        root.querySelector(&#x27;[data-plan-value]&#x27;).textContent = `${plan.routeValue} 金`;
        root.querySelector(&#x27;[data-plan-generated-value]&#x27;).textContent = `生成时 ${plan.routeValue} 金`;
        root.querySelector(&#x27;[data-route-efficiency]&#x27;).textContent = plan.routeMinutes
          ? `${Math.round(plan.routeValue * 60 / plan.routeMinutes)} 金/时`
          : &#x27;—&#x27;;
        const itemCount = plan.taskCount + (plan.raid ? 1 : 0);
        root.querySelector(&#x27;[data-plan-progress]&#x27;).textContent = `0 / ${itemCount}`;
        root.querySelector(&#x27;[data-plan-progress-note]&#x27;).textContent = &#x27;预计耗时均由系统推算&#x27;;
        root.querySelector(&#x27;[data-plan-total]&#x27;).textContent = `计划总计 ${plan.totalMinutes} 分钟`;
        root.querySelector(&#x27;[data-route-total]&#x27;).textContent = `总计 ${plan.routeMinutes} 分钟`;
        root.querySelector(&#x27;[data-plan-start]&#x27;).textContent = plan.regionLabel;
        root.querySelector(&#x27;[data-plan-notice]&#x27;).textContent = &#x27;计划已按当前参数生成；预计耗时为只读，后续学习结果将在重新规划时采用。&#x27;;

        planRaid.style.display = plan.raid ? &#x27;&#x27; : &#x27;none&#x27;;
        if (plan.raid) {
          root.querySelector(&#x27;[data-plan-raid-name]&#x27;).textContent = plan.raid.dataset.raidName;
          root.querySelector(&#x27;[data-plan-raid-detail]&#x27;).textContent = `普通时间块 · ${plan.raid.dataset.raidStatus} · 预计 ${plan.raidMinutes} 分钟 · 已包含集合与前往`;
        }

        planSteps.forEach((step, index) =&gt; {
          const stepPlan = plan.steps[index];
          step.style.display = stepPlan.included ? &#x27;&#x27; : &#x27;none&#x27;;
          if (index === 0 &amp;&amp; stepPlan.included) {
            root.querySelector(&#x27;[data-first-move-detail]&#x27;).textContent = `预计 ${stepPlan.minutes} 分钟 · 来源：系统自动推算`;
          }
          if (step.dataset.stepKind === &#x27;task&#x27;) {
            step.dataset.complete = &#x27;false&#x27;;
            step.dataset.expanded = &#x27;false&#x27;;
            const toggle = step.querySelector(&#x27;.todo-task-toggle&#x27;);
            if (toggle) {
              toggle.textContent = &#x27;＋&#x27;;
              toggle.setAttribute(&#x27;aria-label&#x27;, &#x27;展开任务详情&#x27;);
            }
          }
        });
      };

      tabs.forEach((tab) =&gt; {
        tab.addEventListener(&#x27;click&#x27;, () =&gt; {
          const name = tab.dataset.tab;
          tabs.forEach((item) =&gt; item.setAttribute(&#x27;aria-selected&#x27;, String(item === tab)));
          pages.forEach((page) =&gt; page.dataset.active = String(page.dataset.page === name));
        });
      });

      root.querySelectorAll(&#x27;[data-open-setup]&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; overlay.dataset.open = &#x27;true&#x27;);
      });

      root.querySelectorAll(&#x27;[data-close-setup]&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; overlay.dataset.open = &#x27;false&#x27;);
      });

      root.querySelectorAll(&#x27;[data-mode]&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          root.querySelectorAll(&#x27;[data-mode]&#x27;).forEach((item) =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, String(item === button)));
          raidPicker.dataset.visible = String(button.dataset.mode === &#x27;holiday&#x27;);
          updateEstimatedDuration();
        });
      });

      const updateBudget = () =&gt; {
        const hours = Math.max(0, Number(hoursInput.value) || 0);
        const totalMinutes = Math.round(hours * 60 * 0.85);
        budgetPreview.textContent = `自动规划预算：${formatMinutes(totalMinutes)}（预设本次可玩时长的 85%）`;
        updateEstimatedDuration();
      };

      hoursInput.addEventListener(&#x27;input&#x27;, updateBudget);
      startRegionInput.addEventListener(&#x27;change&#x27;, updateEstimatedDuration);
      root.querySelectorAll(&#x27;input[name=&quot;todo-raid&quot;]&#x27;).forEach((radio) =&gt; {
        radio.addEventListener(&#x27;change&#x27;, updateEstimatedDuration);
      });

      root.querySelectorAll(&#x27;[data-task-row]&#x27;).forEach((row) =&gt; {
        const button = row.querySelector(&#x27;.todo-task-toggle&#x27;);
        if (!button) return;
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          if (row.dataset.complete === &#x27;true&#x27;) {
            row.dataset.complete = &#x27;false&#x27;;
            button.textContent = &#x27;＋&#x27;;
            return;
          }
          const expanded = row.dataset.expanded === &#x27;true&#x27;;
          row.dataset.expanded = String(!expanded);
          button.textContent = expanded ? &#x27;＋&#x27; : &#x27;－&#x27;;
        });
      });

      root.querySelectorAll(&#x27;[data-add-task]&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          button.textContent = &#x27;已加入&#x27;;
          button.disabled = true;
        });
      });

      const candidateSearch = root.querySelector(&#x27;[data-candidate-search]&#x27;);
      const candidateItems = [...root.querySelectorAll(&#x27;[data-candidate-item]&#x27;)];
      const candidateGroups = [...root.querySelectorAll(&#x27;[data-candidate-group]&#x27;)];
      const searchCount = root.querySelector(&#x27;[data-search-count]&#x27;);
      const searchEmpty = root.querySelector(&#x27;[data-search-empty]&#x27;);
      const normalizeSearch = (value) =&gt; String(value || &#x27;&#x27;).toLocaleLowerCase().trim().replace(/\s+/g, &#x27; &#x27;);
      const updateCandidateSearch = () =&gt; {
        const tokens = normalizeSearch(candidateSearch.value).split(&#x27; &#x27;).filter(Boolean);
        let visibleTotal = 0;

        candidateItems.forEach((item) =&gt; {
          const haystack = normalizeSearch(`${item.dataset.searchText || &#x27;&#x27;} ${item.textContent}`);
          const visible = tokens.every((token) =&gt; haystack.includes(token));
          item.dataset.searchHidden = String(!visible);
          if (visible) visibleTotal += 1;
        });

        candidateGroups.forEach((group) =&gt; {
          const visibleInGroup = [...group.querySelectorAll(&#x27;[data-candidate-item]&#x27;)]
            .filter((item) =&gt; item.dataset.searchHidden !== &#x27;true&#x27;).length;
          group.dataset.searchHidden = String(visibleInGroup === 0);
          const count = group.querySelector(&#x27;[data-group-count]&#x27;);
          if (count) count.textContent = `${visibleInGroup} 项`;
        });

        searchCount.textContent = `匹配 ${visibleTotal} / 全部 ${candidateItems.length}`;
        searchEmpty.hidden = visibleTotal !== 0;
      };

      candidateSearch.addEventListener(&#x27;input&#x27;, updateCandidateSearch);
      root.querySelector(&#x27;[data-clear-search]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        candidateSearch.value = &#x27;&#x27;;
        updateCandidateSearch();
        candidateSearch.focus();
      });

      const importButton = root.querySelector(&#x27;[data-import-auction]&#x27;);
      const importResult = root.querySelector(&#x27;[data-import-result]&#x27;);
      importButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        importButton.textContent = &#x27;已导入&#x27;;
        importButton.disabled = true;
        importResult.hidden = false;
      });

      root.querySelector(&#x27;[data-generate]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        applyPlanPreview(getPlanPreview());
        overlay.dataset.open = &#x27;false&#x27;;
        tabs[0].click();
      });
    })();
  &lt;/script&gt;
&lt;/section&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
